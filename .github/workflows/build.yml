name: Build Go EXE

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Go EXE
      run: |
        # যদি আপনার মেইন ফাইলটি কোনো সাব-ফোল্ডারে থাকে তবে পাথ পরিবর্তন করে দিতে পারেন (যেমন: cmd/main.go)
        # 'beast.exe' এর জায়গায় আপনি আপনার পছন্দমতো নাম দিতে পারেন
        go build -o beast.exe .

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: Beast-Windows-EXE
        path: beast.exe
        
